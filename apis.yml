name: Mosanna
description: 'Mosanna Therapeutics is a clinical-stage pharmaceutical company developing
  a nighttime nasal spray therapy for obstructive sleep apnea (OSA). Headquartered in
  Redwood City, California with an office in Basel, Switzerland, the company is pursuing
  a pharmacological alternative to mechanical CPAP devices by reactivating the upper-airway
  muscles that keep the airway open during sleep. Surfaced as a portfolio company of
  Norwest Venture Partners, Mosanna operates a corporate marketing website and publishes
  no public API, developer portal, or developer documentation.'
